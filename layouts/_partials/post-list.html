{{- range .groups -}}
  <h2 id="{{ .label | anchorize }}">{{ .label }}</h2>
  <ul class="post-list">
    {{- range .posts -}}
      {{- $post := . -}}
      <li>
        <a class="post-title-link" href="{{ $post.RelPermalink }}">{{ $post.Title }}</a>
        {{- with $post.Params.tags -}}
          <div class="hx:mt-1 hx:flex hx:flex-wrap">
            {{ partial "tags.html" (dict "context" $post) }}
          </div>
        {{- end -}}
      </li>
    {{- end -}}
  </ul>
{{- end -}}
