{{- $context := .context -}}
{{- range $tag := $context.Params.tags -}}
  {{- with $context.Site.GetPage (printf "/tags/%s" ($tag | urlize)) -}}
    <a class="tag-link hx:text-xs hx:font-medium hx:hover:underline hx:mr-2 hx:whitespace-nowrap" href="{{ .RelPermalink }}">#{{ $tag }}</a>
  {{- end -}}
{{- end -}}
