{{- $context := .context -}}
{{- range $tag := $context.Params.tags -}}
  {{- with $context.Site.GetPage (printf "/tags/%s" ($tag | urlize)) -}}
    <a class="hx:text-xs hx:font-medium hx:text-gray-500! hx:dark:text-gray-400! hx:hover:text-gray-700! hx:dark:hover:text-gray-200! hx:hover:underline hx:mr-2 hx:whitespace-nowrap" href="{{ .RelPermalink }}">#{{ $tag }}</a>
  {{- end -}}
{{- end -}}
