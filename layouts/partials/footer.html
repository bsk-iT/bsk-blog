{{- $copyright := (T "copyright") | default "© 2024 Hextra." -}}


<footer class="hextra-footer hx:bg-gray-100 hx:pb-[env(safe-area-inset-bottom)] hx:dark:bg-neutral-900 hx:print:bg-transparent">
  <div class="hextra-custom-footer hextra-max-footer-width hx:pl-[max(env(safe-area-inset-left),1.5rem)] hx:pr-[max(env(safe-area-inset-right),1.5rem)] hx:text-gray-600 hx:dark:text-gray-400">
    {{- partial "custom/footer.html" (dict "context" . "switchesVisible" false "copyrightVisible" .Site.Params.footer.displayCopyright) -}}
  </div>
  {{- if .Site.Params.footer.displayCopyright -}}
    <div
      class="footer-copyright hextra-max-footer-width hx:mx-auto hx:text-center hx:text-xs hx:pl-[max(env(safe-area-inset-left),1.5rem)] hx:pr-[max(env(safe-area-inset-right),1.5rem)] hx:text-gray-600 hx:dark:text-gray-400"
    >
      {{ $copyright | markdownify }}
    </div>
  {{- end -}}
</footer>
